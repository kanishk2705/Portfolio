services:
  - type: web
    name: ai-ml-portfolio
    runtime: node
    # Persistent disks need a paid instance. On the free plan the SQLite
    # database and every upload are wiped on each deploy/restart.
    plan: starter
    branch: main
    # build:db and seed are both safe to re-run: they only add what is missing
    buildCommand: npm install && npm run build:db && npm run seed
    startCommand: npm start
    autoDeploy: true
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /var/data/portfolio.db
      - key: UPLOADS_PATH
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        sync: false
