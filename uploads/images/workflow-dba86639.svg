<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker></defs><rect width="1600" height="1110" fill="#F8FAFC"/><text x="60" y="66" font-family="Inter, DejaVu Sans, sans-serif" font-size="32" font-weight="800" fill="#1F2937" text-anchor="start" >Smart Resume Analyzer — Analysis Workflow</text><text x="60" y="98" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#6B7280" text-anchor="start" >From an uploaded resume and job description to an explained match score</text><rect x="60" y="150" width="210" height="82" rx="14" fill="#FFF1F3" stroke="#E11D48" stroke-width="2"/><rect x="60" y="150" width="8" height="82" rx="4" fill="#E11D48"/><text x="86" y="186" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" >Resume</text><text x="86" y="210" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#E11D48" text-anchor="start" >PDF or DOCX</text><rect x="60" y="252" width="210" height="82" rx="14" fill="#FFF1F3" stroke="#E11D48" stroke-width="2"/><rect x="60" y="252" width="8" height="82" rx="4" fill="#E11D48"/><text x="86" y="288" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" >Job description</text><text x="86" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="500" fill="#E11D48" text-anchor="start" >pasted text</text><rect x="310" y="150" width="230" height="184" rx="14" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/><rect x="310" y="150" width="8" height="184" rx="4" fill="#4338CA"/><text x="336" y="186" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" >1  Extract text</text><text x="336" y="220" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" >pypdf · python-docx</text><text x="336" y="244" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" >Word tables included</text><rect x="560" y="150" width="230" height="184" rx="14" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/><rect x="560" y="150" width="8" height="184" rx="4" fill="#4338CA"/><text x="586" y="186" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" >2  Find sections</text><text x="586" y="220" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" >Experience, Education,</text><text x="586" y="244" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" >Skills, Projects…</text><text x="586" y="268" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" >JD boilerplate dropped</text><rect x="810" y="150" width="230" height="184" rx="14" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/><rect x="810" y="150" width="8" height="184" rx="4" fill="#4338CA"/><text x="836" y="186" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" >3  Split into units</text><text x="836" y="220" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" >One unit per bullet</text><text x="836" y="244" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" >or sentence (NLTK)</text><rect x="1060" y="150" width="230" height="184" rx="14" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/><rect x="1060" y="150" width="8" height="184" rx="4" fill="#4338CA"/><text x="1086" y="186" 