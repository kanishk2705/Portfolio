equirement, averaged</text><rect x="1170" y="424" width="340" height="130" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><rect x="1170" y="424" width="8" height="130" rx="4" fill="#0F766E"/><text x="1196" y="460" font-family="Inter, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#1F2937" text-anchor="start" >Experience relevance · 20%</text><text x="1196" y="494" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" >Top 5 Experience / Projects</text><text x="1196" y="518" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start" >statements, averaged</text><path d="M 675 334 L 675 372 L 320 372" fill="none" stroke="#94A3B8" stroke-width="2.5"/><path d="M 320 372 L 320 420" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 600 372 L 600 420" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/><text x="690" y="362" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start" >sections + raw text</text><path d="M 1425 334 L 1425 372 L 970 372" fill="none" stroke="#94A3B8" stroke-width="2.5"/><path d="M 970 372 L 970 420" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 1340 372 L 1340 420" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/><text x="1440" y="362" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start" >similarity matrix</text><path d="M 320 554 L 320 600 L 1340 600" fill="none" stroke="#94A3B8" stroke-width="2.5"/><path d="M 600 554 L 600 600" fill="none" stroke="#94A3B8" stroke-width="2.5"/><path d="M 970 554 L 970 600" fill="none" stroke="#94A3B8" stroke-width="2.5"/><path d="M 1340 554 L 1340 600" fill="none" stroke="#94A3B8" stroke-width="2.5"/><path d="M 760 600 L 760 646" fill="none" stroke="#