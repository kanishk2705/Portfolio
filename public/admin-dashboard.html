<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('portfolio-theme'); } catch (e) {}
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/animations.css">
<link rel="stylesheet" href="/assets/css/admin.css">
<link rel="stylesheet" href="/assets/css/editor.css">
</head>
<body class="admin-body">

<div class="admin-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="admin-sidebar__logo">
      <span class="nav__logo-mark">K</span>
      <span>Admin Panel</span>
    </div>

    <nav class="admin-nav" aria-label="Admin navigation">

      <a href="#dashboard" class="admin-nav__link is-active" data-section="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>

      <a href="#projects" class="admin-nav__link" id="nav-projects" data-section="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
        Projects
        <span class="admin-nav__badge" id="badge-total">—</span>
      </a>

      <div class="admin-nav__group">Content</div>

      <a href="#categories" class="admin-nav__link" id="nav-categories" data-section="categories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
        Categories
      </a>

      <a href="#certificates" class="admin-nav__link" id="nav-certs" data-section="certificates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M9 13l-2 8 5-3 5 3-2-8"/></svg>
        Certifications
      </a>

      <a href="#skills" class="admin-nav__link" id="nav-skills" data-section="skills">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        Skills
      </a>

      <div class="admin-nav__group">Profile</div>

      <a href="#research" class="admin-nav__link" id="nav-research" data-section="research">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        Research
      </a>

      <a href="#education" class="admin-nav__link" id="nav-education" data-section="education">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
        Education
      </a>

      <a href="#experience" class="admin-nav__link" id="nav-experience" data-section="experience">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
        Experience
      </a>

      <a href="#journey" class="admin-nav__link" id="nav-journey" data-section="journey">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="19" r="2"/><line x1="12" y1="7" x2="12" y2="17"/><line x1="12" y1="12" x2="18" y2="12"/></svg>
        Journey
      </a>

      <a href="#settings" class="admin-nav__link" id="nav-settings" data-section="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>

      <div class="admin-nav__group">View Site</div>

      <a href="/" target="_blank" class="admin-nav__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>

      <a href="/projects" target="_blank" class="admin-nav__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Projects Page ↗
      </a>

    </nav>

    <div class="admin-sidebar__footer">
      <div class="admin-user">
        <div class="admin-user__avatar" id="user-avatar">K</div>
        <div>
          <div class="admin-user__name" id="user-name">Loading…</div>
          <div class="admin-user__email" id="user-email"></div>
        </div>
      </div>
      <button class="admin-nav__link btn--full" id="logout-btn" style="text-align:left; border:none; background:none; cursor:pointer; color: var(--danger);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
      <div style="margin-top: var(--space-3);">
        <button class="theme-toggle theme-toggle--labeled" data-theme-toggle>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span style="font-size: var(--text-sm); font-weight:500; color: var(--text-secondary);" id="theme-label">Toggle theme</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Mobile sidebar overlay -->
  <div class="admin-sidebar-overlay" id="sidebar-overlay"></div>

  <!-- ============ MAIN ============ -->
  <div class="admin-main">

    <!-- Topbar -->
    <div class="admin-topbar">
      <div style="display:flex; align-items:center; gap: var(--space-4);">
        <button class="admin-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1 id="topbar-title">Dashboard</h1>
      </div>

      <div style="display:flex; align-items:center; gap: var(--space-3);">
        <button class="btn btn--primary btn--sm" id="new-project-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Project
        </button>
      </div>
    </div>

    <!-- ============ SECTION: DASHBOARD ============ -->
    <div class="admin-content" id="section-dashboard">

      <!-- Stat cards -->
      <div class="dash-stats" id="dash-stats">
        <div class="card dash-stat-card skeleton" style="height:130px;"></div>
        <div class="card dash-stat-card skeleton" style="height:130px;"></div>
        <div class="card dash-stat-card skeleton" style="height:130px;"></div>
        <div class="card dash-stat-card skeleton" style="height:130px;"></div>
      </div>

      <!-- Bottom grid -->
      <div class="dash-grid">

        <!-- Recent projects -->
        <div class="card dash-panel">
          <div class="dash-panel__head">
            <h2>Recent Projects</h2>
            <a href="#projects" class="btn btn--ghost btn--sm" data-section="projects">View all →</a>
          </div>
          <div class="recent-list" id="recent-projects">
            <div class="skeleton" style="height:56px; border-radius: var(--radius-md); margin-bottom:4px;"></div>
            <div class="skeleton" style="height:56px; border-radius: var(--radius-md); margin-bottom:4px;"></div>
            <div class="skeleton" style="height:56px; border-radius: var(--radius-md);"></div>
          </div>
        </div>

        <!-- Right column -->
        <div style="display:flex; flex-direction:column; gap: var(--space-5);">

          <!-- Quick actions -->
          <div class="card dash-panel">
            <div class="dash-panel__head">
              <h2>Quick Actions</h2>
            </div>
            <div class="quick-actions">
              <button class="quick-action" id="qa-new-project">
                <div class="quick-action__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </div>
                <div>
                  <div class="quick-action__label">New Project</div>
                  <div class="quick-action__desc">Add a project in under 2 minutes</div>
                </div>
              </button>

              <a href="/projects" target="_blank" class="quick-action">
                <div class="quick-action__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
                <div>
                  <div class="quick-action__label">Preview Portfolio</div>
                  <div class="quick-action__desc">See what visitors see</div>
                </div>
              </a>

              <button class="quick-action" data-section="settings">
                <div class="quick-action__icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                </div>
                <div>
                  <div class="quick-action__label">Site Settings</div>
                  <div class="quick-action__desc">Hero, about, contact links, link preview</div>
                </div>
              </button>
            </div>
          </div>

          <!-- Category breakdown -->
          <div class="card dash-panel">
            <div class="dash-panel__head">
              <h2>By Category</h2>
            </div>
            <div class="category-bar-list" id="category-breakdown">
              <div class="skeleton" style="height:40px; border-radius: var(--radius-sm);"></div>
              <div class="skeleton" style="height:40px; border-radius: var(--radius-sm);"></div>
              <div class="skeleton" style="height:40px; border-radius: var(--radius-sm);"></div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- ============ SECTION: PROJECTS ============ -->
    <div class="admin-content" id="section-projects" style="display:none;">
      <div id="projects-panel-content">
        <!-- populated by admin-dashboard.js -->
      </div>
    </div>

    <!-- ============ SECTION: CATEGORIES ============ -->
    <div class="admin-content" id="section-categories" style="display:none;">
      <div id="categories-panel-content">
        <!-- populated by admin-dashboard.js -->
      </div>
    </div>

    <!-- ============ SECTION: CERTIFICATES ============ -->
    <div class="admin-content" id="section-certificates" style="display:none;">
      <div id="certificates-panel-content">
        <!-- populated by admin-dashboard.js -->
      </div>
    </div>

    <!-- ============ SECTION: SKILLS ============ -->
    <div class="admin-content" id="section-skills" style="display:none;">
      <div id="skills-panel-content">
        <!-- populated by admin-dashboard.js -->
      </div>
    </div>

    <!-- ============ SECTION: RESEARCH INTERESTS ============ -->
    <div class="admin-content" id="section-research" style="display:none;">
      <div id="research-panel-content"></div>
    </div>

    <!-- ============ SECTION: EDUCATION ============ -->
    <div class="admin-content" id="section-education" style="display:none;">
      <div id="education-panel-content"></div>
    </div>

    <!-- ============ SECTION: EXPERIENCE ============ -->
    <div class="admin-content" id="section-experience" style="display:none;">
      <div id="experience-panel-content"></div>
    </div>

    <!-- ============ SECTION: JOURNEY (homepage timeline) ============ -->
    <div class="admin-content" id="section-journey" style="display:none;">
      <div id="journey-panel-content">
        <!-- populated by admin-dashboard.js -->
      </div>
    </div>

    <!-- ============ SECTION: SETTINGS ============ -->
    <div class="admin-content" id="section-settings" style="display:none;">
      <div id="settings-panel-content">
        <!-- populated by admin-dashboard.js -->
      </div>
    </div>

  </div><!-- /admin-main -->
</div><!-- /admin-shell -->

<!-- ============ NEW/EDIT PROJECT DRAWER ============ -->
<div id="project-drawer" style="
  position: fixed; inset: 0;
  z-index: 500;
  display: none;
">
  <!-- Backdrop -->
  <div id="drawer-backdrop" style="
    position: absolute; inset: 0;
    background: var(--bg-overlay);
  "></div>

  <!-- Drawer panel -->
  <div id="drawer-panel" style="
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: min(680px, 100vw);
    background: var(--bg-elevated);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  ">
    <!-- Drawer header -->
    <div style="
      padding: var(--space-5) var(--space-6);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    ">
      <h2 style="font-size: var(--text-xl);" id="drawer-title">New Project</h2>
      <button id="drawer-close" class="btn btn--ghost btn--icon" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Drawer body (scrollable) -->
    <div style="flex: 1; overflow-y: auto; padding: var(--space-6);">
      <div id="drawer-form">
        <!-- form fields injected by admin-dashboard.js -->
      </div>
    </div>

    <!-- Drawer footer -->
    <div style="
      padding: var(--space-5) var(--space-6);
      border-top: 1px solid var(--border);
      display: flex;
      gap: var(--space-3);
      justify-content: flex-end;
      flex-shrink: 0;
      background: var(--bg-subtle);
    ">
      <button class="btn btn--secondary" id="save-draft-btn">Save Draft</button>
      <button class="btn btn--primary" id="publish-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Publish
      </button>
    </div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/theme.js"></script>
<script src="/assets/js/admin-api.js"></script>
<script src="/assets/js/editor.js"></script>
<script src="/assets/js/uploader.js"></script>
<script src="/assets/js/admin-dashboard.js"></script>
</body>
</html>
