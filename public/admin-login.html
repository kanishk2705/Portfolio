<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Kanishk Portfolio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('portfolio-theme'); } catch (e) {}
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/animations.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">

<div class="login-page">
  <!-- Background blobs -->
  <div class="blob login-page__blob-1" aria-hidden="true"></div>
  <div class="blob login-page__blob-2" aria-hidden="true"></div>

  <!-- Theme toggle (top-right) -->
  <button class="theme-toggle" data-theme-toggle
    style="position:fixed; top:var(--space-5); right:var(--space-5);">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <div class="card login-card animate-slide-up">
    <!-- Logo -->
    <div class="login-card__logo">
      <span class="nav__logo-mark">K</span>
      <span>Kanishk</span>
    </div>

    <h1>Admin Login</h1>
    <p class="login-card__subtitle">Sign in to manage your portfolio</p>

    <!-- Error message -->
    <div class="form-error" id="login-error" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="login-error-text"></span>
    </div>

    <!-- Login form -->
    <div>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input
          class="form-input"
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-field">
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            style="padding-right: 3rem;"
          >
          <button
            class="password-toggle"
            id="password-toggle"
            type="button"
            aria-label="Show password"
          >
            <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button
        class="btn btn--primary btn--full"
        id="login-btn"
        type="button"
        style="margin-top: var(--space-2);"
      >
        Sign in
      </button>
    </div>

    <p style="margin-top: var(--space-6); text-align:center; font-size: var(--text-xs); color: var(--text-tertiary);">
      <a href="/" style="color: var(--text-secondary);">← Back to portfolio</a>
    </p>
  </div>
</div>

<script src="/assets/js/theme.js"></script>
<script src="/assets/js/admin-api.js"></script>
<script src="/assets/js/admin-login.js"></script>
</body>
</html>
