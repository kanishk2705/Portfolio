<!-- ============ FOOTER ============ -->
<footer class="footer">
  <div class="container">
    <div class="footer__grid">
      <div class="footer__brand">
        <a href="/" class="nav__logo">
          <span class="nav__logo-mark">{{ site.initial }}</span>
          {{ site.name }}
        </a>
        <p>{{ footer.tagline }}</p>
      </div>

      <div>
        <div class="footer__heading">Navigate</div>
        <div class="footer__links">
          <a href="/">Home</a>
          <a href="/projects">Projects</a>
          <a href="/#about">About</a>
          {{#if has.research}}<a href="/#research">Research</a>{{/if}}
          {{#if has.background}}<a href="/#background">Background</a>{{/if}}
          <a href="/#contact">Contact</a>
        </div>
      </div>

      <div>
        <div class="footer__heading">Connect</div>
        <div class="footer__links">
          <a href="{{ contact.mailto | attr }}" data-hide-if-empty>Email</a>
          <a href="{{ contact.github | attr }}" target="_blank" rel="noopener noreferrer" data-hide-if-empty>GitHub</a>
          <a href="{{ contact.linkedin | attr }}" target="_blank" rel="noopener noreferrer" data-hide-if-empty>LinkedIn</a>
          <a href="{{ cv.url | attr }}" target="_blank" rel="noopener" data-hide-if-empty>CV</a>
        </div>
      </div>
    </div>

    <div class="footer__bottom">
      <span>© {{ year }} {{ site.name }}. All rights reserved.</span>
      <span>Built with vanilla JS, Express &amp; SQLite.</span>
    </div>
  </div>
</footer>

<button class="back-to-top" data-back-to-top aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>

<script src="/assets/js/theme.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/nav.js"></script>
<script src="/assets/js/cards.js"></script>
